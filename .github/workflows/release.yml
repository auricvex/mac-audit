name: Release

# Builds an aarch64-apple-darwin tarball + SHA-256 manifest on v* tags.
# NOTE: manifest.json's "signature" is empty until Ade's signing step
# exists — and mac-audit's updater FAILS CLOSED on unsigned manifests,
# so these artifacts are publishable but not auto-installable yet.
# That gap is intentional (see docs/DESIGN.md §7).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: test first
        run: cargo test --all-targets
      - name: build aarch64-apple-darwin
        run: cargo build --release --target aarch64-apple-darwin
      - name: package + manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/mac-audit dist/
          cp README.md LICENSE install.sh dist/
          tar -czf "mac-audit-${VERSION}-aarch64-apple-darwin.tar.gz" -C dist .
          SHA=$(shasum -a 256 "mac-audit-${VERSION}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "version": "${VERSION#v}",
            "url": "https://github.com/auricvex/mac-audit/releases/download/${VERSION}/mac-audit-${VERSION}-aarch64-apple-darwin.tar.gz",
            "sha256": "${SHA}",
            "signature": null
          }
          EOF
          cat manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mac-audit-*-aarch64-apple-darwin.tar.gz
            manifest.json
